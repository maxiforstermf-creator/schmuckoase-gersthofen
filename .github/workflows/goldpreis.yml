name: Goldpreis aktualisieren

on:
  schedule:
    # Werktags stündlich zur Minute 5, 05–18 Uhr UTC
    # → deckt 7–19 Uhr deutscher Zeit ab (Sommer- und Winterzeit)
    - cron: '5 5-18 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goldpreis
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kurs abrufen
        run: node tools/goldpreis.mjs
      - name: Commit, falls geändert
        run: |
          if git diff --quiet data/goldpreis.json; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name "goldpreis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/goldpreis.json
          git commit -m "Goldpreis aktualisiert [skip ci]"
          git push
