<script>
  // Vor dem ersten Paint: JS-Klasse + Intro nur beim ersten Besuch pro Session
  (function (d) {
    var c = d.documentElement.classList; c.add('js');
    try {
      if (!d.documentElement.hasAttribute('data-intro') || sessionStorage.getItem('so-intro') || matchMedia('(prefers-reduced-motion: reduce)').matches) c.add('no-intro');
      else sessionStorage.setItem('so-intro', '1');
    } catch (e) { c.add('no-intro'); }
  })(document);
</script>
<script type="module" src="/js/main.js"></script>
